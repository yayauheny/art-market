<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{login.title}">Login</title>
</head>
<body>
<div th:insert="~{fragment :: locale}"></div>
<form action="/login" method="post">
  <div style="color: red" th:if="${param.error}">
    <span th:text="#{login.error}">Bad credentials</span>
  </div>
  <label for="username">
    <span th:text="#{login.username} + ':'">Username:</span>
    <input id="username" type="text" name="username">
  </label><br>
  <label for="password">
    <span th:text="#{login.password} + ':'">Password:</span>
    <input id="password" type="password" name="password">
  </label><br>
  <button type="submit" th:text="#{login.button}">Login</button>
</form>

<form action="/users/register">
  <button type="submit" th:text="#{registration.button}">Registration</button>
</form>
</body>
</html>
