<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{users.title}">Users</title>
</head>
<body>
<div th:insert="~{fragment :: header}"></div>

<form action="/users" method="get">
  <label for="name">
    <span th:text="#{users.filter.name} + ':'">Name:</span>
    <input id="name" type="text" name="name" th:value="${filter.getName()}">
  </label>

  <label for="lastName">
    <span th:text="#{users.filter.lastName} + ':'">Lastname:</span>
    <input id="lastName" type="text" name="lastName" th:value="${filter.getLastName()}">
  </label>

  <div>
    <span th:text="#{users.filter.role} + ':'">Role:</span>
    <div th:each="role : ${roles}">
      <input th:id="${role}" type="radio" name="role" th:value="${role}"
             th:checked="${role == filter.getRole()}">
      <label th:for="${role}" th:text="${role}">Role</label>
    </div>
  </div>

  <label for="birthDate">
    <span th:text="#{users.filter.birthDate} + ':'">Birthdate:</span>
    <input id="birthDate" type="date" name="birthDate" th:value="${filter.getBirthDate()}">
  </label>

  <div>
    <label for="page">
      <span th:text="#{users.filter.page} + ':'">Page:</span>
      <input id="page" type="number" name="page" th:value="${users.metadata.page}">
    </label>

    <label for="size">
      <span th:text="#{users.filter.size} + ':'">Size:</span>
      <input id="size" type="number" name="size" th:value="${users.metadata.size}">
    </label>
  </div>

  <button type="submit" th:text="#{users.filter.button}">Filter</button>
</form>

<div th:each="user, iterStat : ${users.content}">
  <a th:href="@{'/users/' + ${user.id}}"
     th:text="|${iterStat.count}. ${user.name()} (${user.email()})|">User</a>
</div>
</body>
</html>
